<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Timetable">
<title>AI · Section 2 Timetable</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --lec:#a9bdf2;--tut:#cdb9ee;--lab:#a5d8c1;--gap:#8795ab;--ink:#e4eaf4;--mute:#97a3b8}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%;background:#151a2b}
body{background:linear-gradient(160deg,#141a2c 0%,#1a2036 50%,#17283a 100%) fixed;color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif;letter-spacing:.005em}
h1,h2{font-family:Fraunces,Georgia,serif;font-weight:500}
h1{font-size:2rem!important;letter-spacing:-.01em}
.pill{font-size:11px;font-weight:500;padding:3px 10px;border-radius:999px;border:1px solid transparent}
.Lecture{background:rgba(169,189,242,.13);color:var(--lec);border-color:rgba(169,189,242,.22)}
.Tutorial{background:rgba(205,185,238,.13);color:var(--tut);border-color:rgba(205,185,238,.22)}
.Lab{background:rgba(165,216,193,.13);color:var(--lab);border-color:rgba(165,216,193,.22)}
.Gap{background:rgba(135,149,171,.1);color:var(--gap);border-color:rgba(135,149,171,.18)}
.card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:14px 16px;position:relative;overflow:hidden;transition:transform .25s ease,background .25s ease}
.card:hover{background:rgba(255,255,255,.07);transform:translateY(-1px)}
.card:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--gap);opacity:.8}
.card.Lecture:before{background:var(--lec)}.card.Tutorial:before{background:var(--tut)}.card.Lab:before{background:var(--lab)}
.card.Gap{background:transparent;border-style:dashed;border-color:rgba(255,255,255,.1)}
.card.now{background:rgba(190,200,255,.1);border-color:rgba(190,200,255,.4);box-shadow:0 0 36px rgba(160,175,255,.18)}
.pill-now{background:rgba(190,200,255,.2);color:#e1e6ff;border-color:rgba(190,200,255,.4);animation:breathe 3s ease-in-out infinite}
.pill-next{background:rgba(240,214,160,.14);color:#f0d6a0;border-color:rgba(240,214,160,.25)}
@keyframes breathe{50%{opacity:.6}}
.seg{display:inline-flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.06)}
.seg button{padding:7px 18px;border-radius:999px;font-size:14px;color:var(--mute);transition:all .2s}
.seg .seg-on{background:rgba(190,200,255,.2);color:#eef1ff}
.tab{padding:6px 14px;border-radius:999px;font-size:14px;border:1px solid rgba(255,255,255,.1);color:var(--mute)}
.tab-on{background:rgba(190,200,255,.2);color:#eef1ff;border-color:rgba(190,200,255,.35)}
.hd{background:rgba(255,255,255,.05);color:var(--mute);border-radius:14px}
.hd-today{background:rgba(190,200,255,.2);color:#eef1ff;border-radius:14px}
.empty-cell{background:rgba(255,255,255,.025);border-radius:12px}
.grid-wrap{overflow-x:auto}
input[type=search]{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.09)!important;border-radius:999px!important;padding:9px 18px!important;color:var(--ink)}
input::placeholder{color:#7e8aa0}
html{-webkit-text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden}
button{touch-action:manipulation}
.seg button,.tab,#filters .pill{min-height:44px}
.seg button{display:inline-flex;align-items:center}
.tab{display:inline-flex;align-items:center;flex:0 0 auto}
#filters .pill{display:inline-flex;align-items:center}
#dayTabs{scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#dayTabs::-webkit-scrollbar{display:none}
.tab{scroll-snap-align:start}
input[type=search]{font-size:16px!important;min-height:44px;width:100%}
.wk-grid{display:none}.wk-cards{display:grid}
@media (min-width:900px){.wk-grid{display:block}.wk-cards{display:none}}
@media (max-width:480px){
 .wrap{padding-left:max(16px,env(safe-area-inset-left))!important;padding-right:max(16px,env(safe-area-inset-right))!important}
 h1{font-size:1.65rem!important}
 .seg{width:100%}.seg button{flex:1;justify-content:center}
 .card{padding:14px}
 .card .font-semibold{font-size:16px;line-height:1.35}
}
@media (hover:none){.card:hover{transform:none;background:rgba(255,255,255,.045)}}
</style>
</head>
<body class="min-h-screen">
<div class="wrap max-w-6xl mx-auto p-4 pb-10">
  <header class="mb-4">
    <h1 class="text-2xl font-bold">AI Department · Section 2</h1>
    <p class="text-[color:var(--mute)] text-sm">3rd Year CSIT · Fall 2026 · <span id="clock"></span></p>
  </header>

  <div class="flex flex-col sm:flex-row gap-3 sm:items-center mb-3">
    <div class="seg">
      <button id="vToday" class="">Today</button>
      <button id="vWeek" class="">Full Week</button>
    </div>
    <input id="q" type="search" placeholder="Search subject, code or room…" class="flex-1 min-w-[200px] bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500">
  </div>
  <div id="filters" class="flex flex-wrap gap-2 mb-4"></div>
  <div id="dayTabs" class="flex gap-2 overflow-x-auto mb-4 -mx-1 px-1"></div>
  <main id="out"></main>
  <p class="text-xs text-[color:var(--mute)] mt-8 text-center">Edit the <code>SCHEDULE</code> JSON in the page source to change any class.</p>
</div>

<script>
/* ---------- EDITABLE DATA ---------- */
const PERIODS = [
  {s:"9:00",e:"9:50"},{s:"9:50",e:"10:40"},{s:"10:45",e:"11:35"},{s:"11:35",e:"12:25"},
  {s:"12:30",e:"1:20"},{s:"1:20",e:"2:10"},{s:"2:15",e:"3:05"},{s:"3:05",e:"3:55"}
];
/* from/to = period numbers (1-8), inclusive. modified:true = edited per your instructions */
const SCHEDULE = {
  Sunday: [
    {code:"CSC 317",name:"Computer Graphics and Visualization (FR BCS Elective 3)",type:"Lecture",from:3,to:4,room:"B7 Theater",instructor:"Dr. Hataba"},
    {code:"CNC 314",name:"Database Systems",type:"Lecture",from:5,to:6,room:"B7 Theater",instructor:"Dr. Mohamed Issa"}
  ],
  Monday: [
    {code:"AID 312",name:"Intelligent Systems",type:"Lecture",from:1,to:2,room:"B17 F1.03",instructor:"Dr. Amena / Dr. Ahmed Bayoumi"},
    {code:"CNC 311",name:"Computer Networks",type:"Lecture",from:3,to:4,room:"Blue Hall",instructor:"Dr. Shalaby"},
    {code:"—",name:"Probability and Statistics",type:"Lecture",from:5,to:6,room:"B18 G13",instructor:"TBA",modified:true},
    {code:"AID 312",name:"Intelligent Systems",type:"Lab",from:7,to:8,room:"B18 G0.17",instructor:"Eng. Salma Waleed"}
  ],
  Tuesday: [
    {code:"AID 311",name:"Mathematics of Data Science",type:"Tutorial",from:1,to:1,room:"B7 F1.23",instructor:"Eng. Sama Alqasaby",modified:true},
    {code:"CSC 317",name:"Computer Graphics and Visualization",type:"Lab",from:3,to:4,room:"B18 G0.5",instructor:"Eng. Omnia Shehata"},
    {code:"AID 311",name:"Mathematics of Data Science",type:"Lecture",from:5,to:6,room:"B7 G01",instructor:"Dr. Abdel-Wahab"},
    {code:"CNC 311",name:"Computer Networks",type:"Lab",from:7,to:8,room:"B17 G0.16",instructor:"Eng. Samaa Osama"}
  ],
  Wednesday: [
    {code:"—",name:"Probability and Statistics",type:"Tutorial",from:4,to:4,room:"B7 F1.21",instructor:"TBA",modified:true},
    {code:"CNC 314",name:"Database Systems",type:"Lab",from:5,to:6,room:"B17 G0.1",instructor:"Eng. Nourhan Waleed"},
    {code:"AID 311",name:"Mathematics of Data Science",type:"Lab",from:7,to:8,room:"B18 G0.5",instructor:"Eng. Sama Alqasaby"}
  ],
  Thursday: []
};
/* ---------- APP ---------- */
const DAYS = Object.keys(SCHEDULE), TYPES = ["Lecture","Tutorial","Lab"];
const $ = id => document.getElementById(id);
const toMin = t => { let [h,m]=t.split(":").map(Number); if(h<8) h+=12; return h*60+m; };
const start = c => toMin(PERIODS[c.from-1].s), end = c => toMin(PERIODS[c.to-1].e);
const fmt = c => PERIODS[c.from-1].s+" – "+PERIODS[c.to-1].e;
const todayName = () => DAYS[new Date().getDay()] || null; // Sun=0..Thu=4, else null (Fri/Sat)
let state = {view:"today", types:new Set(TYPES), q:"", day: todayName() || "Sunday"};

const nowMin = () => { const d=new Date(); return d.getHours()*60+d.getMinutes(); };
const isActive = (c,day) => day===todayName() && nowMin()>=start(c) && nowMin()<end(c);
const match = c => state.types.has(c.type) &&
  (c.name+" "+c.code+" "+c.room+" "+c.instructor).toLowerCase().includes(state.q.toLowerCase());

function dayItems(day, withGaps){
  const cls = SCHEDULE[day].filter(match).sort((a,b)=>a.from-b.from);
  if(!withGaps || state.q || state.types.size<3) return cls;
  const out=[]; let p=1;
  const all = SCHEDULE[day].slice().sort((a,b)=>a.from-b.from);
  all.forEach(c=>{ if(c.from>p) out.push({type:"Gap",name:"Free period",from:p,to:c.from-1}); out.push(c); p=Math.max(p,c.to+1); });
  return out;
}
function card(c,day){
  const gap=c.type==="Gap", active=!gap&&isActive(c,day);
  const past = day===todayName() && nowMin()>=end(c);
  const next = !gap && day===todayName() && !active && start(c)>nowMin() && start(c)===Math.min(...SCHEDULE[day].filter(x=>start(x)>nowMin()).map(start));
  return `<div class="card ${c.type} ${active?"now":""} ${past?"opacity-50":""}">
    <div class="flex flex-wrap items-center gap-2 mb-1">
      <span class="pill ${c.type}">${gap?"Gap":c.type}</span>
      ${active?'<span class="pill pill-now">● Active Now</span>':""}
      ${next?'<span class="pill pill-next">Up Next</span>':""}
      ${c.modified?'<span class="pill Gap">edited</span>':""}
      <span class="ml-auto text-xs text-[color:var(--mute)]">${fmt(c)}</span>
    </div>
    <div class="font-semibold ${gap?"text-[color:var(--mute)]":""}">${gap?c.name:(c.code!=="—"?c.code+" · ":"")+c.name}</div>
    ${gap?"":`<div class="text-sm text-[color:var(--mute)] mt-1">📍 ${c.room} &nbsp;·&nbsp; 👤 ${c.instructor}</div>`}
  </div>`;
}
function renderToday(){
  const day=state.day, items=dayItems(day,true);
  const label = day===todayName() ? "Today · "+day : day;
  const note = todayName()? "" : '<p class="text-[color:#f0d6a0] text-sm mb-3">It\'s the weekend — pick a day below to preview.</p>';
  $("out").innerHTML = note+`<h2 class="text-lg font-semibold mb-3">${label}</h2>`+
    (items.length? `<div class="grid gap-3 md:grid-cols-2">${items.map(c=>card(c,day)).join("")}</div>`
                 : '<p class="text-[color:var(--mute)]">No classes match.</p>');
}
function renderWeek(){
  // Desktop: CSS grid (days × periods). Mobile: stacked day cards.
  let g = `<div class="wk-grid grid-wrap"><div class="grid gap-1" style="grid-template-columns:90px repeat(5,minmax(150px,1fr));grid-template-rows:auto repeat(8,minmax(64px,auto))">`;
  g += `<div></div>`+DAYS.map(d=>`<div class="text-center font-medium py-2 ${d===todayName()?"hd-today":"hd"}">${d}</div>`).join("");
  PERIODS.forEach((p,i)=>{ g+=`<div class="text-xs text-[color:var(--mute)] pr-2 text-right pt-1" style="grid-row:${i+2};grid-column:1">${p.s}<br>${p.e}</div>`;
    DAYS.forEach((d,j)=>{ g+=`<div class="empty-cell" style="grid-row:${i+2};grid-column:${j+2}"></div>`; }); });
  DAYS.forEach((d,j)=>SCHEDULE[d].filter(match).forEach(c=>{
    const a=isActive(c,d);
    g+=`<div class="card ${c.type} ${a?"now":""} text-xs z-10" style="grid-row:${c.from+1}/${c.to+2};grid-column:${j+2};padding:8px">
      <div class="flex gap-1 flex-wrap mb-1"><span class="pill ${c.type}">${c.type}</span>${a?'<span class="pill pill-now">Active Now</span>':""}</div>
      <div class="font-semibold">${c.code!=="—"?c.code+" ":""}${c.name}</div>
      <div class="text-[color:var(--mute)]">${c.room}<br>${c.instructor}</div></div>`; }));
  g+=`</div></div>`;
  const m = DAYS.map(d=>{ const it=dayItems(d,false);
    return `<section><h3 class="font-semibold mb-2 ${d===todayName()?"text-[color:#b9c4ff]":""}">${d}</h3>`+
      (it.length?`<div class="grid gap-2">${it.map(c=>card(c,d)).join("")}</div>`:'<p class="text-[color:var(--mute)] text-sm">No classes</p>')+`</section>`; }).join("");
  $("out").innerHTML = g+`<div class="wk-cards gap-5">${m}</div>`;
}
function render(){
  $("vToday").className=state.view==="today"?"seg-on":"";
  $("vWeek").className=state.view==="week"?"seg-on":"";
  $("dayTabs").style.display = state.view==="today"?"flex":"none";
  $("dayTabs").innerHTML = DAYS.map(d=>`<button data-d="${d}" class="tab ${d===state.day?"tab-on":""}">${d.slice(0,3)}</button>`).join("");
  $("filters").innerHTML = TYPES.map(t=>`<button data-t="${t}" class="pill ${t} ${state.types.has(t)?"":"opacity-40"}" style="font-size:13px;padding:6px 16px">${t}</button>`).join("");
  state.view==="today"?renderToday():renderWeek();
}
$("vToday").onclick=()=>{state.view="today";render()};
$("vWeek").onclick=()=>{state.view="week";render()};
$("q").oninput=e=>{state.q=e.target.value;render()};
$("dayTabs").onclick=e=>{const d=e.target.dataset.d; if(d){state.day=d;render()}};
$("filters").onclick=e=>{const t=e.target.dataset.t; if(t){state.types.has(t)?state.types.delete(t):state.types.add(t);render()}};
function tick(){ $("clock").textContent=new Date().toLocaleString([], {weekday:"long",hour:"2-digit",minute:"2-digit"}); }
tick(); render(); setInterval(()=>{tick();render()},30000);
</script>
</body>
</html>
